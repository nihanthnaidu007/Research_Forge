version: '3.8'

# Local development only.
# Runs Postgres so you can develop without installing it locally.
# Backend: cd backend && uvicorn server:app --reload --port 8000
# Frontend: cd frontend && yarn start

services:
  postgres:
    image: postgres:16-alpine
    container_name: researchforge-postgres
    environment:
      POSTGRES_USER: researchforge
      POSTGRES_PASSWORD: researchforge
      POSTGRES_DB: researchforge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U researchforge"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

